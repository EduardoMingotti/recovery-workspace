<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5b2c83"><title>Recovery Workspace V2</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script></head><body>
<div id="toast" class="toast"></div><section id="setup" class="panel hidden"><h1>Recovery Workspace</h1><p>Configure a URL e a chave publicável do Supabase.</p><label>Project URL<input id="url"></label><label>Publishable key<input id="key"></label><button id="saveCfg" class="primary">Salvar</button></section>
<section id="login" class="panel hidden"><h1>Recovery Workspace</h1><form id="loginForm"><label>E-mail<input id="email" type="email" required></label><label>Senha<input id="password" type="password" required></label><button class="primary">Entrar</button></form></section>
<div id="app" class="hidden"><header><div><b>Recovery Workspace</b><small id="who"></small></div><nav><button id="templateBtn">Baixar modelo CSV</button><input id="file" type="file" accept=".csv" hidden><button id="importBtn">Importar CSV</button><button id="settingsBtn">Configurações</button><button id="reportBtn">Relatório</button><button id="logoutBtn">Sair</button></nav></header>
<section class="toolbar"><input id="search" placeholder="Pesquisar clínica em todos os leads..."><select id="originFilter"><option value="">Todas as origens</option></select><button id="searchBtn" class="primary">Buscar</button><button id="clearBtn">Limpar</button></section><div id="searchResults" class="search-results hidden"></div><main id="board"></main></div>
<dialog id="leadDlg"><div class="dlgHead"><h2 id="leadTitle">Lead</h2><button class="x" data-close>×</button></div><form id="leadForm"><input id="leadId" type="hidden"><div class="grid"><label>Clínica<input id="clinica" required></label><label>Origem<input id="origem"></label><label>Etapa<select id="etapa"></select></label><label>Link HubSpot<input id="crm" type="url"></label><label>Resultado<input id="resultado"></label><label>Valor recuperado<input id="valor" type="number" min="0" step="0.01"></label><label>Última atividade<input id="ultima" type="date"></label><label>Categoria de perda<select id="categoria"><option value="">Selecione</option></select></label><label>Motivo de perda<select id="motivo"><option value="">Selecione</option></select></label></div><label>Detalhamento / observações<textarea id="obs"></textarea></label><div class="actions"><a id="crmLink" target="_blank" class="btn hidden">Abrir HubSpot</a><button class="primary">Salvar</button></div></form></dialog>
<dialog id="settingsDlg"><div class="dlgHead"><h2>Configurações</h2><button class="x" data-close>×</button></div><h3>Etapas</h3><div id="stageSettings"></div><form id="newStage" class="inline"><input id="stageName" placeholder="Nova etapa"><select id="stageType"><option value="cadencia">Cadência</option><option value="conectado">Conectado</option></select><button>Adicionar</button></form><h3>Categorias e motivos de perda</h3><div id="lossSettings"></div><form id="newCategory" class="inline"><input id="categoryName" placeholder="Nova categoria"><button>Adicionar</button></form></dialog>
<dialog id="importDlg"><div class="dlgHead"><h2>Importar CSV</h2><button class="x" data-close>×</button></div><p>A primeira linha é tratada como cabeçalho e não vira lead.</p><div id="mapping"></div><div class="actions"><button id="doImport" class="primary">Importar</button></div></dialog>
<dialog id="reportDlg"><div class="dlgHead"><h2>Relatório executivo</h2><button class="x" data-close>×</button></div><div class="grid"><label>Início<input id="rStart" type="date"></label><label>Fim<input id="rEnd" type="date"></label></div><div class="actions"><button id="runReport" class="primary">Gerar relatório</button></div></dialog>
<script src="app.js"></script></body></html>
